<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DormMaster - ระบบจัดการหอพักอัจฉริยะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        
        <!-- พื้นที่สำหรับโหลด Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8">
                <h1 class="text-xl font-semibold text-gray-700" id="page-title">ภาพรวมระบบหอพัก</h1>
                <div class="flex items-center space-x-4">
                    <span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-medium">🟢 เชื่อมต่อระบบเรียลไทม์</span>
                </div>
            </header>

            <main class="p-8" id="main-content">
                <!-- เนื้อหาแต่ละหน้าจะถูกโหลดมาใส่ที่นี่อัตโนมัติ -->
            </main>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
