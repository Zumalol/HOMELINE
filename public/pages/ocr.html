<div class="bg-white p-6 rounded-xl shadow-sm border w-full max-w-5xl">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-xl font-bold text-gray-800">📄 รายการบิลที่ออกแล้ว</h2>
            <p class="text-sm text-gray-500">ตรวจสอบรูปภาพบิลแจ้งหนี้ที่ระบบสร้างขึ้นในโฟลเดอร์ exports</p>
        </div>
        
        <!-- แถบตัวกรองและค้นหาบิล -->
        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-xs mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- 1. ค้นหาตามชื่อไฟล์ / เลขห้อง -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">🔍 ค้นหาบิล</label>
                    <input type="text" 
                        id="searchBillInput" 
                        onkeyup="filterExportedBills()" 
                        placeholder="พิมพ์ชื่อไฟล์ หรือ เลขห้อง..." 
                        class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>

                <!-- 2. ตัวกรองกลุ่มหอพัก -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">🏢 กลุ่มหอพัก</label>
                    <select id="filterBillDorm" 
                            onchange="filterExportedBills()" 
                            class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                        <option value="all">🏢 ทุกกลุ่มหอพัก</option>
                    </select>
                </div>

                <!-- 3. ตัวกรองประจำเดือนที่ออกบิล -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">📅 บิลออกเดือนไหน</label>
                    <input type="month" 
                        id="filterBillMonth" 
                        onchange="filterExportedBills()" 
                        class="w-full px-3.5 py-2 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>

            </div>

            <!-- ปุ่มรีเซ็ตตัวกรอง -->
            <div class="flex justify-end mt-3">
                <button onclick="resetBillFilters()" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1">
                    🔄 ล้างตัวกรองทั้งหมด
                </button>
            </div>
        </div>

        <!-- ตาราง/การ์ดแสดงรายการบิล -->
        <div id="bills-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- รายการบิลจะถูกวาดที่นี่ -->
        </div>
            
    <!-- พื้นที่แสดงการ์ดบิล -->
    <div id="bills-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <div class="text-center py-10 text-gray-400 col-span-full">
            ⏳ กำลังโหลดข้อมูลบิล...
        </div>
    </div>
</div>
