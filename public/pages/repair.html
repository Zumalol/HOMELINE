<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <!-- ส่วนหัวและตัวกรอง -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
        <div>
            <h2 class="text-2xl font-black text-gray-800">🔧 รายการแจ้งซ่อม</h2>
            <p class="text-sm text-gray-500 mt-1">ติดตามและจัดการรายการแจ้งซ่อมจากผู้เช่า</p>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
            <select id="repairStatusFilter" onchange="filterRepairs()" class="bg-gray-50 border border-gray-200 text-gray-700 rounded-xl px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
                <option value="all">สถานะทั้งหมด</option>
                <option value="Pending">🔴 รอดำเนินการ</option>
                <option value="In Progress">🟡 กำลังซ่อมแซม</option>
                <option value="Completed">🟢 เสร็จสิ้น</option>
            </select>
            <input type="text" id="searchRepairInput" onkeyup="filterRepairs()" placeholder="ค้นหาเลขห้อง..." class="bg-gray-50 border border-gray-200 text-gray-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none w-full sm:w-64">
        </div>
    </div>

    <!-- ตารางแจ้งซ่อม -->
    <div class="overflow-x-auto rounded-xl border border-gray-100">
        <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
                <tr class="bg-gray-50 text-gray-600 text-sm border-b border-gray-100">
                    <th class="p-4 font-bold w-32">วันที่แจ้ง</th>
                    <th class="p-4 font-bold w-24">ห้อง</th>
                    <th class="p-4 font-bold">รายละเอียดปัญหา</th>
                    <th class="p-4 font-bold w-32">ดูรูปภาพ</th>
                    <th class="p-4 font-bold w-32">ผู้แจ้ง</th>
                    <th class="p-4 font-bold w-32 text-center">สถานะ</th>
                    <th class="p-4 font-bold w-24 text-center">จัดการ</th>
                </tr>
            </thead>
            <!-- แทนที่ <tbody> เดิมด้วยโค้ดนี้ เพื่อแก้ปัญหา colspan ให้ครบ 7 ช่อง -->
            <tbody id="repair-table-body" class="text-gray-700 divide-y divide-gray-100">
                <tr>
                    <td colspan="7" class="text-center py-10 text-indigo-400 font-medium animate-pulse">
                        ⏳ กำลังโหลดข้อมูลแจ้งซ่อม...
                    </td>
                </tr>
            </tbody>


        </table>
    </div>
</div>
<!-- เพิ่มโค้ด Modal สำหรับดูรูปภาพ ไว้ต่อจาก </div> ปิดท้ายสุดของไฟล์ -->
<div id="repairImageModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity">
    <div class="relative bg-white rounded-2xl p-4 max-w-3xl w-full mx-4 shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
            <h3 class="text-lg font-black text-gray-800">📸 รูปภาพแจ้งซ่อม</h3>
            <button onclick="closeRepairImageModal()" class="text-gray-400 hover:text-rose-500 font-bold text-2xl transition-colors">&times;</button>
        </div>
        <div class="flex justify-center bg-gray-50 rounded-xl overflow-hidden p-2 border border-gray-100">
            <img id="modalImagePreview" src="" class="max-h-[70vh] object-contain rounded-lg">
        </div>
    </div>
</div>
