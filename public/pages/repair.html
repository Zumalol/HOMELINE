<!-- /pages/repair.html -->
<div class="space-y-6 animate-fade-in w-full max-w-7xl mx-auto pb-10">
    
    <!-- ส่วนหัวและเครื่องมือค้นหา -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div>
            <h2 class="text-2xl font-black text-gray-800 flex items-center gap-2">
                <span class="p-2 bg-indigo-50 text-indigo-600 rounded-xl">🛠️</span> 
                รายการแจ้งซ่อมจากผู้เช่า
            </h2>
            <p class="text-sm text-gray-500 mt-2 font-medium">ติดตามสถานะและอัปเดตงานซ่อมแซมภายในหอพัก</p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
            <div class="relative w-full sm:w-64">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">🔍</span>
                <input type="text" id="searchRepair" placeholder="ค้นหาเลขห้อง, อาการ..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition-all shadow-sm bg-gray-50 focus:bg-white">
            </div>
            <select id="filterRepairStatus" class="px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm font-medium bg-white text-gray-700 cursor-pointer">
                <option value="all">สถานะทั้งหมด</option>
                <option value="pending">🔴 รอดำเนินการ</option>
                <option value="progress">🟡 กำลังซ่อมแซม</option>
                <option value="completed">✅ ซ่อมเสร็จสิ้น</option>
            </select>
        </div>
    </div>

    <!-- การ์ดสรุปสถานะ (Overview Cards) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- รอดำเนินการ -->
        <div class="bg-gradient-to-br from-rose-50 to-white p-5 rounded-2xl border border-rose-100 shadow-sm flex items-center justify-between hover:shadow-md transition-all">
            <div>
                <p class="text-rose-600 text-sm font-bold">รอดำเนินการ</p>
                <h3 class="text-3xl font-black text-rose-700 mt-1" id="repair-pending-count">0</h3>
            </div>
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-xl shadow-inner">
                🚨
            </div>
        </div>
        
        <!-- กำลังดำเนินการ -->
        <div class="bg-gradient-to-br from-amber-50 to-white p-5 rounded-2xl border border-amber-100 shadow-sm flex items-center justify-between hover:shadow-md transition-all">
            <div>
                <p class="text-amber-600 text-sm font-bold">กำลังซ่อมแซม</p>
                <h3 class="text-3xl font-black text-amber-700 mt-1" id="repair-progress-count">0</h3>
            </div>
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-xl shadow-inner">
                🚧
            </div>
        </div>

        <!-- เสร็จสิ้น -->
        <div class="bg-gradient-to-br from-emerald-50 to-white p-5 rounded-2xl border border-emerald-100 shadow-sm flex items-center justify-between hover:shadow-md transition-all">
            <div>
                <p class="text-emerald-600 text-sm font-bold">ซ่อมเสร็จสิ้นเดือนนี้</p>
                <h3 class="text-3xl font-black text-emerald-700 mt-1" id="repair-completed-count">0</h3>
            </div>
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xl shadow-inner">
                ✨
            </div>
        </div>
    </div>

    <!-- ตารางรายการแจ้งซ่อม -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-100 text-sm text-gray-500">
                        <th class="p-4 font-semibold whitespace-nowrap">วันที่แจ้ง</th>
                        <th class="p-4 font-semibold">ห้องพัก</th>
                        <th class="p-4 font-semibold">รายละเอียดปัญหา</th>
                        <th class="p-4 font-semibold">ภาพประกอบ</th>
                        <th class="p-4 font-semibold">สถานะ</th>
                        <th class="p-4 font-semibold text-center rounded-tr-2xl">การจัดการ</th>
                    </tr>
                </thead>
                <!-- ID สำหรับให้ fetchRepairPage() นำข้อมูลมาแสดง -->
                <tbody id="repair-table-body" class="divide-y divide-gray-100">
                    
                    <!-- Placeholder ขณะรอโหลดข้อมูล -->

                            ⏳ กำลังโหลดรายการแจ้งซ่อม...
                        </td>
                    </tr>

            </table>
        </div>

        <div id="repair-pagination" class="p-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center text-sm text-gray-500">

        </div>
    </div>
