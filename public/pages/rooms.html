<div class="space-y-8 pb-12 font-sans text-gray-800">
    
    <!-- 🏢 การ์ดจัดการกลุ่มหอพัก (Dormitory Groups) -->
    <div class="bg-white/80 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 transition-all duration-300 hover:shadow-md">
        <!-- Header & ปุ่มเพิ่มหอพักด้านบน -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-5 border-b border-gray-100/80 pb-6">
            <div class="flex items-center gap-4">
                <div class="p-3.5 bg-gradient-to-tr from-indigo-500 to-violet-600 text-white rounded-2xl shadow-md shadow-indigo-100 flex items-center justify-center transform transition-transform hover:scale-105">
                    <span class="text-2xl">🏢</span>
                </div>
                <div>
                    <h3 class="text-xl font-black text-gray-800 tracking-tight">จัดการกลุ่มหอพัก</h3>
                    <p class="text-sm text-gray-400 mt-0.5 font-medium">เพิ่มหรือจัดการชื่ออาคารและสาขาหอพักในระบบ</p>
                </div>
            </div>
            
            <!-- ส่วน Input และปุ่ม Icon เพิ่ม -->
            <div class="flex w-full sm:w-auto gap-3">
                <div class="relative w-full sm:w-72">
                    <input type="text" id="newDormName" placeholder="ระบุชื่อหอพักใหม่..." class="w-full px-4 py-3 text-sm border border-gray-200/80 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:outline-none bg-gray-50/50 hover:bg-white transition-all shadow-2xs" />
                </div>
                <button onclick="addDormitory()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white px-6 py-3 rounded-2xl transition-all font-bold shadow-lg shadow-indigo-200 hover:shadow-indigo-300 active:scale-95 flex items-center justify-center gap-2 text-sm whitespace-nowrap cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    <span>เพิ่มอาคาร</span>
                </button>
            </div>
        </div>
        
        <!-- รายการหอพัก -->
        <ul id="dormitory-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-2">
            <!-- แสดงรายการจาก JS -->
        </ul>
    </div>

    <!-- 🚪 การ์ดจัดการห้องพัก (Room Management) -->
    <div class="bg-white/80 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 transition-all duration-300">
        <!-- Header ของห้องพัก -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-gray-100/80 pb-6">
            <div class="flex items-center gap-4">
                <div class="p-3.5 bg-gradient-to-tr from-emerald-500 to-teal-600 text-white rounded-2xl shadow-md shadow-emerald-100 flex items-center justify-center transform transition-transform hover:scale-105" id="room-form-icon">
                    <span class="text-2xl">🚪</span>
                </div>
                <div>
                    <h3 class="text-xl font-black text-gray-800 tracking-tight">จัดการข้อมูลห้องพัก</h3>
                    <p class="text-sm text-gray-400 mt-0.5 font-medium">เพิ่ม แก้ไข สถานะการเช่า และสถานะการจองห้องพักในระบบ</p>
                </div>
            </div>
        </div>
 
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10">
            <!-- ส่วนที่ 1: ฟอร์มเพิ่ม/แก้ไขข้อมูลห้องพัก (4 Columns) -->
            <div class="lg:col-span-4 bg-gradient-to-b from-gray-50/80 to-gray-50/30 p-6 rounded-3xl border border-gray-100 h-fit shadow-inner">
                <div class="flex items-center gap-2.5 pb-4 border-b border-gray-200/60 mb-5">
                    <div class="w-8 h-8 rounded-xl bg-gray-200/60 flex items-center justify-center text-gray-600 font-bold">
                        ✍️
                    </div>
                    <h4 id="room-form-title" class="text-base font-extrabold text-gray-700">ฟอร์มข้อมูลห้องพัก</h4>
                </div>
                
                <form onsubmit="saveRoom(event)" class="space-y-4">
                    <input type="hidden" id="roomId" />

                    <!-- ส่วนอัปโหลดรูปภาพห้องพัก (รองรับหลายรูปภาพ) -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">รูปภาพห้องพัก (เลือกได้หลายรูป)</label>
                        <div class="relative group">
                            <input type="file" id="roomImageFile" accept="image/*" multiple onchange="previewRoomImages(event)" class="block w-full text-xs text-gray-500 file:mr-4 file:py-3 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 transition-all border border-gray-200 rounded-2xl bg-white cursor-pointer shadow-2xs">
                        </div>
                        <input type="hidden" id="roomImageData" />
                        
                        <!-- Grid แสดงรายการพรีวิวรูปภาพที่เลือก -->
                        <div id="roomImagePreviewContainer" class="hidden mt-3 grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
                    </div>
                    
                    <!-- กลุ่มหอพัก / อาคาร -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">กลุ่มหอพัก / อาคาร <span class="text-red-500">*</span></label>
                        <select id="roomDormSelect" required class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:outline-none bg-white text-sm transition-all shadow-2xs">
                            <option value="">-- เลือกกลุ่มหอพัก --</option>
                        </select>
                    </div>

                    <!-- เลขห้อง และ ประเภทห้อง (Grid แบ่งครึ่ง) -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">เลขห้อง <span class="text-red-500">*</span></label>
                            <input type="text" id="roomNumber" required placeholder="เช่น 103" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:outline-none text-sm bg-white transition-all shadow-2xs" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">ประเภทห้อง</label>
                            <select id="roomType" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:outline-none bg-white text-sm transition-all shadow-2xs">
                                <option value="Type A">Type A</option>
                                <option value="Type B">Type B</option>
                                <option value="Type C">Type C</option>
                            </select>
                        </div>
                    </div>

                    <!-- ราคาค่าเช่า -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">ราคาค่าเช่า/เดือน (บาท) <span class="text-red-500">*</span></label>
                        <input type="number" id="roomPrice" required placeholder="เช่น 4500" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:outline-none text-sm bg-white transition-all shadow-2xs" />
                    </div>

                    <!-- สถานะห้อง -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">สถานะการเข้าพัก</label>
                        <select id="roomStatus" onchange="toggleTenantInput()" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:outline-none bg-white text-sm transition-all shadow-2xs">
                            <option value="Vacant">ห้องว่าง</option>
                            <option value="Occupied">มีผู้เช่าแล้ว</option>
                        </select>
                    </div>

                    <!-- ชื่อผู้เช่า -->
                    <div id="tenantBox" style="display:none;" class="transition-all duration-300 ease-in-out">
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">ชื่อผู้เช่า</label>
                        <input list="room-tenant-list" id="roomTenant" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 focus:outline-none text-sm bg-white transition-all shadow-2xs" placeholder="พิมพ์ชื่อเพื่อค้นหา..." autocomplete="off" />
                        <datalist id="room-tenant-list"></datalist>
                    </div>

                    <!-- ส่วนตัวติ๊กการจอง และ เตรียมย้ายออก -->
                    <div class="flex flex-col sm:flex-row gap-4 pt-2">
                        <label class="inline-flex items-center gap-2.5 cursor-pointer group p-2.5 rounded-xl bg-white border border-gray-100 hover:border-indigo-200 transition-all flex-1 shadow-2xs">
                            <input type="checkbox" id="roomBookedTick" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer">
                            <span class="text-xs font-bold text-gray-700 group-hover:text-indigo-600 transition-colors">📌 จองล่วงหน้า</span>
                        </label>

                        <label class="inline-flex items-center gap-2.5 cursor-pointer group p-2.5 rounded-xl bg-white border border-gray-100 hover:border-amber-200 transition-all flex-1 shadow-2xs">
                            <input type="checkbox" id="roomMovingOutTick" onchange="toggleMoveOutInput()" class="w-4 h-4 text-amber-500 rounded border-gray-300 focus:ring-amber-500 cursor-pointer">
                            <span class="text-xs font-bold text-gray-700 group-hover:text-amber-600 transition-colors">📦 เตรียมออก</span>
                        </label>
                    </div>
                    
                    <!-- ช่องระบุวัน/เดือน ย้ายออก -->
                    <div id="moveOutBox" class="hidden grid-cols-1 sm:grid-cols-2 gap-3 p-4 bg-amber-50/60 rounded-2xl border border-amber-200/60 shadow-2xs">
                        <div>
                            <label class="block text-[11px] font-bold text-amber-800 uppercase mb-1.5">วันที่ย้ายออก</label>
                            <input type="text" id="moveOutDay" placeholder="เช่น 15" class="w-full px-3 py-2 bg-white border border-amber-200 rounded-xl text-xs focus:ring-2 focus:ring-amber-400 focus:outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-amber-800 uppercase mb-1.5">เดือน</label>
                            <select id="moveOutMonth" class="w-full px-3 py-2 bg-white border border-amber-200 rounded-xl text-xs focus:ring-2 focus:ring-amber-400 focus:outline-none transition-all">
                                <option value="">-- เลือกเดือน --</option>
                                <option value="ม.ค.">มกราคม</option>
                                <option value="ก.พ.">กุมภาพันธ์</option>
                                <option value="มี.ค.">มีนาคม</option>
                                <option value="เม.ย.">เมษายน</option>
                                <option value="พ.ค.">พฤษภาคม</option>
                                <option value="มิ.ย.">มิถุนายน</option>
                                <option value="ก.ค.">กรกฎาคม</option>
                                <option value="ส.ค.">สิงหาคม</option>
                                <option value="ก.ย.">กันยายน</option>
                                <option value="ต.ค.">ตลาคม</option>
                                <option value="พ.ย.">พฤศจิกายน</option>
                                <option value="ธ.ค.">ธันวาคม</option>
                            </select>
                        </div>
                    </div>

                    <!-- ปุ่มบันทึก/ยกเลิก -->
                    <div class="flex space-x-3 pt-3">
                        <button type="submit" id="room-submit-btn" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 text-white py-3.5 rounded-2xl font-bold hover:from-emerald-700 hover:to-teal-700 transition-all shadow-lg shadow-emerald-200 hover:shadow-emerald-300 active:scale-95 text-sm flex items-center justify-center gap-2 cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                            บันทึกข้อมูล
                        </button>
                        <button type="button" id="room-cancel-btn" onclick="resetRoomForm()" class="hidden px-5 bg-white border border-gray-200 text-gray-600 py-3.5 rounded-2xl font-bold hover:bg-gray-100 transition-all text-sm cursor-pointer shadow-2xs">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- ส่วนที่ 2: ตารางแสดงรายการห้องพักทั้งหมด (8 Columns) -->
            <div class="lg:col-span-8 flex flex-col gap-4">
                
                <!-- ส่วน Filter และ Search เหนือตาราง -->
                <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 bg-gray-50/60 p-4 rounded-2xl border border-gray-100 shadow-2xs">
                    <div class="flex items-center gap-2.5">
                        <span class="text-xs font-bold uppercase tracking-wider text-gray-500">กรองข้อมูล:</span>
                        <select id="tableDormFilter" onchange="applyRoomFilters()" class="px-3.5 py-2.5 border border-gray-200 rounded-xl text-xs font-bold text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white shadow-2xs cursor-pointer">
                            <option value="all">🏢 ทุกกลุ่มหอพัก</option>
                        </select>
                    </div>
                    
                    <div class="relative flex-1 sm:max-w-xs">
                        <input type="text" id="tableSearchRoom" oninput="applyRoomFilters()" placeholder="ค้นหาเลขห้อง / ชื่อผู้เช่า..." class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white shadow-2xs">
                        <span class="absolute left-3 top-3 text-gray-400 text-xs">🔍</span>
                    </div>
                </div>

                <!-- ตาราง -->
                <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr class="bg-gray-50/90 text-gray-400 text-[11px] font-black uppercase tracking-wider border-b border-gray-100">
                                    <th class="p-4">ห้อง</th>
                                    <th class="p-4">กลุ่มหอพัก</th>
                                    <th class="p-4">ประเภท</th>
                                    <th class="p-4">ราคา</th>
                                    <th class="p-4">สถานะ</th>
                                    <th class="p-4 text-center">เตรียมออก</th>
                                    <th class="p-4">ผู้เช่า</th>
                                    <th class="p-4 text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="rooms-table-body" class="text-sm divide-y divide-gray-50">
                                <!-- ข้อมูลห้องพักจะถูกวาดลงตรงนี้ไม่เกิน 8 แถวต่อหน้า -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- คอนเทนเนอร์ปุ่มกดเปลี่ยนหน้า (Pagination) -->
                <div id="rooms-pagination" class="flex justify-end pt-2"></div>
            </div>
        </div>
    </div>
</div>
