<div class="max-w-7xl mx-auto space-y-6 p-4">
    <!-- Header with Add Button -->
    <div class="relative overflow-hidden bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="relative z-10">
            <h2 class="text-2xl font-extrabold text-gray-800 tracking-tight flex items-center gap-2">
                <span class="text-3xl drop-shadow-sm">📋</span> รายชื่อผู้เช่าทั้งหมด
            </h2>
            <p class="text-sm text-gray-500 mt-1.5 font-medium">จัดการข้อมูลผู้เช่า แก้ไข หรือเพิ่มผู้เช่าใหม่เข้าสู่ระบบอย่างง่ายดาย</p>
        </div>
        <button onclick="openTenantModal()" class="relative z-10 inline-flex items-center justify-center bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-6 py-3 rounded-xl font-bold hover:from-indigo-700 hover:to-violet-700 transition-all duration-300 shadow-lg hover:shadow-indigo-500/30 gap-2 transform hover:-translate-y-0.5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            <span>เพิ่มผู้เช่าใหม่</span>
        </button>
        <!-- Decorative Background Blob -->
        <div class="absolute -top-12 -right-12 w-48 h-48 bg-indigo-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
    </div>

   <!-- Search Section -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col sm:flex-row items-center gap-3">
        <div class="relative flex-1 w-full">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <input type="text" id="searchTenantInput" onkeyup="filterTenants()" placeholder="ค้นหาชื่อ, ชื่อเล่น, เบอร์โทร, LINE ID หรือเลขบัตร..." class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors">
        </div>
        <button onclick="filterTenants()" class="w-full sm:w-auto inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md shadow-indigo-200 transition-all transform hover:-translate-y-0.5 gap-2 shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span>ค้นหา</span>
        </button>
    </div>

    <!-- Tenant Cards Grid -->
    <div id="tenant-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- การ์ดผู้เช่าจะถูกนำมาแสดงที่นี่อัตโนมัติ -->
    </div>

    <!-- Tenant Cards Grid -->
    <div id="tenant-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- การ์ดผู้เช่าจะถูกโหลดมาใส่ที่นี่อัตโนมัติผ่าน JS -->
    </div>

    <!-- Modal Form -->
    <div id="tenantModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl border border-gray-100 max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 relative transform transition-transform">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-5 border-b border-gray-100 mb-6">
                <div class="flex items-center space-x-4">
                    <div class="bg-gradient-to-br from-indigo-100 to-violet-100 p-3 rounded-2xl text-indigo-600 text-xl shadow-inner">👤</div>
                    <h3 id="modal-tenant-title" class="text-2xl font-extrabold text-gray-800 tracking-tight">เพิ่มข้อมูลผู้เช่าใหม่</h3>
                </div>
                <button type="button" onclick="closeTenantModal()" class="text-gray-400 hover:text-rose-500 bg-gray-50 hover:bg-rose-50 p-2 rounded-full text-xl font-bold cursor-pointer transition-colors">&times;</button>
            </div>

            <!-- OCR Section -->
            <div class="mb-8 bg-gradient-to-br from-blue-50 via-indigo-50/50 to-violet-50 p-6 rounded-2xl border border-indigo-100/60 shadow-sm relative overflow-hidden group">
                <div class="absolute -top-4 -right-4 p-4 opacity-10 text-8xl transform group-hover:scale-110 transition-transform duration-500">📸</div>
                <div class="relative z-10 flex flex-col md:flex-row md:items-center gap-5">
                    <div class="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center text-3xl shrink-0 border border-blue-100">
                        ✨
                    </div>
                    <div class="flex-1">
                        <h4 class="text-base font-bold text-indigo-900 mb-1">ดึงข้อมูลจากบัตรประชาชน (AI OCR)</h4>
                        <p class="text-xs text-indigo-600/90 mb-4 font-medium">อัปโหลดภาพบัตรเพื่อเติม ชื่อ, เลขบัตร และที่อยู่ อัตโนมัติ</p>
                        <input type="file" id="ocrUpload" accept="image/*" onchange="handleOcrUpload(event)" 
                               class="block w-full text-sm text-indigo-700 
                                      file:mr-4 file:py-2.5 file:px-5 
                                      file:rounded-full file:border-0 
                                      file:text-sm file:font-bold 
                                      file:bg-indigo-600 file:text-white 
                                      hover:file:bg-indigo-700 hover:file:shadow-md file:transition-all
                                      cursor-pointer bg-white/70 rounded-full border border-indigo-200/50 shadow-sm focus:outline-none"/>
                    </div>
                </div>
            </div>
            
            <!-- Form -->
            <form id="tenant-form" class="space-y-5" onsubmit="saveTenant(event)">
            <input type="hidden" id="tenant-id" value="">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <!-- 1. ช่องชื่อ - นามสกุล -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">ชื่อ - นามสกุล <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">📝</div>
                        <input type="text" id="ocr-name" required class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors" placeholder="เช่น นายสมชาย ใจดี">
                    </div>
                </div>

                <!-- 2. ช่องชื่อเล่น (สลับมาอยู่ช่องกลางให้ถูกต้อง) -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">ชื่อเล่น</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">🏷️</div>
                        <input type="text" id="ocr-nickname" class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors" placeholder="เช่น สม, หญิง">
                    </div>
                </div>

                <!-- 3. ช่องเลขบัตรประชาชน -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">เลขบัตรประชาชน</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">🪪</div>
                        <input type="text" id="ocr-id" class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors" placeholder="x-xxxx-xxxxx-xx-x">
                    </div>
                </div>
            </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">เบอร์โทรศัพท์ <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">📱</div>
                            <input type="text" id="ocr-phone" required class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors" placeholder="081-234-5678">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">เบอร์ผู้ปกครอง</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">👨‍👩‍👧</div>
                            <input type="text" id="ocr-parent-phone" class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors" placeholder="089-876-5432">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">LINE ID</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">💬</div>
                            <input list="line-friends-list" id="ocr-line-id" class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors" placeholder="พิมพ์ชื่อเพื่อค้นหา LINE ID" autocomplete="off">
                            <datalist id="line-friends-list"></datalist>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">ที่อยู่ตามบัตรประชาชน</label>
                    <div class="relative">
                        <div class="absolute top-3 left-0 pl-3.5 pointer-events-none text-gray-400">🏠</div>
                        <textarea id="ocr-address" rows="3" class="block w-full pl-10 pr-4 py-2.5 rounded-xl border-gray-200 bg-gray-50 focus:bg-white shadow-sm border focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors leading-relaxed" placeholder="ที่อยู่ปัจจุบัน..."></textarea>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="flex items-center justify-end space-x-4 pt-6 border-t border-gray-100 mt-8">
                    <button type="button" onclick="closeTenantModal()" class="px-6 py-2.5 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-100 text-sm font-bold transition-colors">ยกเลิก</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 text-sm font-bold shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>
</div>
